# Camic — Flatpak manifest
#
# Build:
#   flatpak install --user flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
#   flatpak install --user flathub org.freedesktop.Extension??   # not required
#   flatpak-builder --force-clean --user --install build-dir packaging/flatpak/com.camic.Camic.yml
#   flatpak run com.camic.Camic
#
# NOTE (before Flathub submission): Flathub requires OFFLINE builds. This draft
# currently allows network during the build (npm ci + electron-builder download
# Electron). To satisfy Flathub review, replace that with declared sources:
#   * declare https://github.com/electron/electron/releases/download/v33.4.11/
#     electron-v33.4.11-linux-x64.zip as a `type: archive` source and point
#     electron-builder at it (build.electronDist / ELECTRON_MIRROR=file://),
#   * declare each npm dependency as a `type: file` source from the npm
#     registry and use `npm ci --offline`.
# Verify with: flatpak-builder --run build-dir <manifest> sh -c 'ffmpeg -version'

app-id: com.camic.Camic
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: camic-desktop

# The app shells out to `ffmpeg` (shipped in the Platform runtime, 7.1.3),
# talks to the phone over the LAN (mDNS discovery + TCP), renders a window,
# plays through PipeWire/PulseAudio, and writes to /dev/video* (v4l2loopback).
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all
  - --filesystem=/dev
  - --talk-name=org.freedesktop.portal.Desktop

modules:
  # The freedesktop SDK ships no Node, so vendor an official Node binary
  # build-time only. It lands in /app/opt/node and is trimmed after the build.
  - name: node
    buildsystem: simple
    build-commands:
      - mkdir -p /app/opt/node
      - cp -a bin include lib share /app/opt/node/
    sources:
      - type: archive
        url: https://nodejs.org/dist/v22.23.1/node-v22.23.1-linux-x64.tar.xz
        sha256: 9749e988f437343b7fa832c69ded82a312e41a03116d766797ac14f6f9eee578

  - name: camic
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
      env:
        PATH: /app/opt/node/bin:/usr/bin:/bin
        npm_config_cache: /run/build/camic/.npm
    build-commands:
      - cd desktop && npm ci --no-audit --no-fund
      - cd desktop && npx electron-builder --linux dir
      # Ship the unpacked Electron app under /app/camic
      - mkdir -p /app/camic
      - cp -a desktop/release/linux-unpacked/. /app/camic/
      # Wrapper: Electron's own chromium sandbox can't be SUID inside a
      # Flatpak, and bwrap already sandboxes us, so disable it here.
      - mkdir -p /app/bin
      - |
        printf '#!/bin/sh\nexec /app/camic/camic-desktop --no-sandbox "$@"\n' \
          > /app/bin/camic-desktop
      - chmod +x /app/bin/camic-desktop
      - install -Dm644 packaging/flatpak/com.camic.Camic.desktop
          /app/share/applications/com.camic.Camic.desktop
      - install -Dm644 packaging/flatpak/com.camic.Camic.metainfo.xml
          /app/share/metainfo/com.camic.Camic.metainfo.xml
      - install -Dm644 desktop/build/icon.png
          /app/share/icons/hicolor/512x512/apps/com.camic.Camic.png
      # Node was only needed to build — drop it from the published app.
      - rm -rf /app/opt/node
    sources:
      - type: git
        url: https://github.com/camic/camic.git
        branch: main
