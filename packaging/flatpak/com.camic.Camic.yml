# Camic — Flatpak manifest (Flathub-ready, fully OFFLINE build)
#
# Sources are all pinned with checksums; the build itself never touches the
# network (a Flathub requirement). The app is plain JS + one npm dependency
# tree, so there is no compile step: the electron dist is unpacked, the
# checked-out sources and node_modules are dropped into resources/app/, and a
# wrapper execs the electron binary.
#
# Local test build:
#   flatpak install --user flathub org.flatpak.Builder \
#     org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
#   flatpak run org.flatpak.Builder --force-clean --user --install \
#     build-flatpak packaging/flatpak/com.camic.Camic.yml
#   flatpak run com.camic.Camic
#
# Verify ffmpeg inside the sandbox:
#   flatpak run --command=ffmpeg com.camic.Camic -version

app-id: com.camic.Camic
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: camic-desktop

# The app shells out to `ffmpeg` (in the freedesktop runtime), talks to the
# phone over the LAN (mDNS discovery + TCP/UDP), renders a window, plays
# through PulseAudio/PipeWire, and writes to /dev/video* (v4l2loopback).
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all

modules:
  # Electron runtime, unpacked to /app/camic. Not SUID-able inside a Flatpak
  # (bwrap already sandboxes us), so the wrapper passes --no-sandbox.
  - name: electron
    buildsystem: simple
    sources:
      - type: archive
        url: https://github.com/electron/electron/releases/download/v33.4.11/electron-v33.4.11-linux-x64.zip
        sha256: 212d431c7c916292311c797cd91f84467c5abd6e6983cf24b162efff64cee8a9
        strip-components: 0
    build-commands:
      - mkdir -p /app/camic
      - cp -a . /app/camic/
      - rm -f /app/camic/resources/default_app.asar

  # The application itself: git checkout + the 6 production npm packages,
  # extracted straight into resources/app/node_modules (flat layout, as npm
  # installs them — no npm/node needed at build time).
  - name: camic
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/camic/camic.git
        branch: main
      - type: file
        url: https://registry.npmjs.org/bonjour-service/-/bonjour-service-1.4.4.tgz
        sha512: 8c265c56fedea1ce107ac46c730119b5244e05e9fee8ba4a026048b10610aec01e5472f2317597fede9e215e4a891658354065f1e56a226104310f0be7e73f2b
        dest: deps
      - type: file
        url: https://registry.npmjs.org/multicast-dns/-/multicast-dns-7.2.5.tgz
        sha512: d9ece73c93fccf60452d7e74b5fd0bb8e0eba4836a3f5455226fc239b6d37014484d08260bf4e3711105d4d79307321c4795cefee916a3e6073a305b17022ea6
        dest: deps
      - type: file
        url: https://registry.npmjs.org/dns-packet/-/dns-packet-5.6.1.tgz
        sha512: 97881c4a8ba172020a46fcb2f7d44d54e8315e289c13eda366836668d999e895e219a8c138901eb24d4e06526e33993673e7ae74674bc43a97b8f08a223ea4a7
        dest: deps
      - type: file
        url: https://registry.npmjs.org/thunky/-/thunky-1.1.0.tgz
        sha512: 78763b9c17ed813841a8ec8719537e97c805d01b9c3f4f5f328d283bf2dbd30d4e17cd1d26ffa50d5a571bad16310be47310243726cab2b10813766d28698fac
        dest: deps
      - type: file
        url: https://registry.npmjs.org/fast-deep-equal/-/fast-deep-equal-3.1.3.tgz
        sha512: 7f7a90f68432f63d808417bf1fd542f75c0b98a042094fe00ce9ca340606e61b303bb04b2a3d3d1dce4760dcfd70623efb19690c22200da8ad56cd3701347ce1
        dest: deps
      - type: file
        url: https://registry.npmjs.org/@leichtgewicht/ip-codec/-/ip-codec-2.0.5.tgz
        sha512: 568f8f4a9646dbf7e682688dcd82bda96461f21fc21ebc03d26a358750f32f8cb31cd49f598ba319362c586ade0f4d3481c82667b2b862ce93c7d4f1b6c29d0f
        dest: deps
    build-commands:
      - mkdir -p /app/camic/resources/app /app/bin
      - cp -a desktop/src desktop/package.json /app/camic/resources/app/
      # npm tarballs contain a single "package/" directory; unpack each flat.
      - |
        set -e
        N=/app/camic/resources/app/node_modules
        mkdir -p "$N"
        for spec in \
          "deps/bonjour-service-1.4.4.tgz:bonjour-service" \
          "deps/multicast-dns-7.2.5.tgz:multicast-dns" \
          "deps/dns-packet-5.6.1.tgz:dns-packet" \
          "deps/thunky-1.1.0.tgz:thunky" \
          "deps/fast-deep-equal-3.1.3.tgz:fast-deep-equal" \
          "deps/ip-codec-2.0.5.tgz:@leichtgewicht/ip-codec"
        do
          tgz="${spec%%:*}"; name="${spec##*:}"
          mkdir -p "$N/$name"
          tar -xzf "$tgz" -C "$N/$name" --strip-components=1
        done
      # Wrapper: Electron's own chromium sandbox can't be SUID inside a
      # Flatpak, and bwrap already sandboxes us, so disable it here.
      # The raw electron dist names the binary "electron".
      # ozone-platform-hint=auto: pick Wayland inside the sandbox when the
      # session is Wayland, fall back to X11 otherwise.
      - |
        printf '#!/bin/sh\nexec /app/camic/electron --no-sandbox --ozone-platform-hint=auto "$@"\n' \
          > /app/bin/camic-desktop
      - chmod +x /app/bin/camic-desktop
      - install -Dm644 packaging/flatpak/com.camic.Camic.desktop
          /app/share/applications/com.camic.Camic.desktop
      - install -Dm644 packaging/flatpak/com.camic.Camic.metainfo.xml
          /app/share/metainfo/com.camic.Camic.metainfo.xml
      - install -Dm644 desktop/build/icon.png
          /app/share/icons/hicolor/512x512/apps/com.camic.Camic.png
